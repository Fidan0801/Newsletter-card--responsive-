<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assests/shared-css/general.css">
    <link rel="stylesheet" href="../../assests/shared-css/reset.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <section>
        <div class="container align--center">
            <div class="newsletter__card">
                <div class="newsletter__content">
                    <div>
                        <h2>Stay updated!</h2>
                        <p>Join 60,000 product managers receiving monthly updates on:</p>
                        <ul class="newsletter__list">
                            <li>Product discovery and building what matters</li>
                            <li> Measuring to ensure updates are a success</li>
                            <li>And much more!</li>
                        </ul>
                    </div>
                    <form action="../submit/index.html">
                        <div class="newsletter__input">
                            <label for="email">Email address</label>
                            <input type="text" placeholder="company@gmail.com" required>
                        </div>
                        <button class="newsletter__button">Subscribe to monthly newsletter</button>
                    </form>
                </div>
                <div class="newsletter__image"><img src="../../assests/images/image.jpg" alt=""></div>
            </div>
        </div>
    </section>
</body>

</html>
